# PadLink daemon 发版单源：打 v* tag → GitHub Actions（macos-latest）跑本配置 →
# GitHub Releases 出 tar.gz（linux 三二进制+udev/systemd 安装物；darwin 双二进制+launchd 安装物）
# 与 deb/rpm（padlinkd+padlinkctl+udev 规则+user 单元）。
# darwin 注入后端为 cgo（internal/quartz），必须在 macOS runner 本机构建；
# linux 全量 CGO_ENABLED=0 交叉编译，nfpm 为纯 Go 不受影响。
# 本地验证：goreleaser release --snapshot --clean（产物落 dist/，已 gitignore）。
version: 2

project_name: padlink

builds:
  - id: padlinkd-linux
    dir: daemon
    main: ./cmd/padlinkd
    binary: padlinkd
    goos: [linux]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X main.daemonVersion={{ .Version }}
  - id: padlinkd-darwin
    dir: daemon
    main: ./cmd/padlinkd
    binary: padlinkd
    goos: [darwin]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=1] # internal/quartz 调 ApplicationServices 框架
    ldflags:
      - -s -w -X main.daemonVersion={{ .Version }}
  - id: padlinkctl-linux
    dir: daemon
    main: ./cmd/padlinkctl
    binary: padlinkctl
    goos: [linux]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    # ldflags 用块列表：模板 {{ }} 的花括号在行内序列 [] 里会被 YAML 当嵌套 mapping
    ldflags:
      - -s -w -X main.ctlVersion={{ .Version }}
  - id: padlinkctl-darwin
    dir: daemon
    main: ./cmd/padlinkctl
    binary: padlinkctl
    goos: [darwin]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X main.ctlVersion={{ .Version }}
  - id: padlinktoy
    dir: daemon
    main: ./cmd/padlinktoy
    binary: padlinktoy
    goos: [linux]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    ldflags: [-s, -w]
  - id: padlinkd-windows
    dir: daemon
    main: ./cmd/padlinkd
    binary: padlinkd
    goos: [windows]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    # -H=windowsgui：daemon 无控制台窗口（关闭控制台=杀进程，实测踩坑）；
    # 交互调试由 attachParentConsole 接回父控制台，--test 重定向句柄不受影响
    ldflags:
      - -H=windowsgui -s -w -X main.daemonVersion={{ .Version }}
  - id: padlinkctl-windows
    dir: daemon
    main: ./cmd/padlinkctl
    binary: padlinkctl
    goos: [windows]
    goarch: [amd64, arm64]
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w -X main.ctlVersion={{ .Version }}

archives:
  - id: tgz-linux
    formats: [tar.gz]
    ids: [padlinkd-linux, padlinkctl-linux, padlinktoy]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - src: daemon/packaging/install.sh
        dst: install.sh
      - src: daemon/packaging/udev/69-padlink-uinput.rules
        dst: packaging/udev/69-padlink-uinput.rules
      - src: daemon/packaging/systemd/padlink-local.service
        dst: packaging/systemd/padlink-local.service
  - id: tgz-darwin
    formats: [tar.gz]
    ids: [padlinkd-darwin, padlinkctl-darwin]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - src: daemon/packaging/macos/install.sh
        dst: install.sh
      - src: daemon/packaging/macos/uninstall.sh
        dst: uninstall.sh
      - src: daemon/packaging/macos/signing-identity.sh
        dst: packaging/macos/signing-identity.sh
      - src: daemon/packaging/macos/PadLink.app.Info.plist
        dst: packaging/macos/PadLink.app.Info.plist
      - src: daemon/packaging/macos/PadLink.app.icon.png
        dst: packaging/macos/PadLink.app.icon.png
      - src: daemon/packaging/macos/make-appicon.m
        dst: packaging/macos/make-appicon.m
      - src: daemon/packaging/macos/com.zhimingcool.padlink.plist
        dst: packaging/macos/com.zhimingcool.padlink.plist
  - id: tgz-windows
    formats: [tar.gz]
    ids: [padlinkd-windows, padlinkctl-windows]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - src: daemon/packaging/windows/install.ps1
        dst: install.ps1

nfpms:
  - id: padlink
    package_name: padlink
    ids: [padlinkd-linux, padlinkctl-linux]
    formats: [deb, rpm]
    vendor: padlink
    homepage: https://github.com/Norman-pong/padlink
    maintainer: normanpong
    license: Apache-2.0
    description: |-
      Use a HarmonyOS phone as a low-latency wireless touchpad, keyboard and
      voice-dictation device for this PC (GNOME Wayland / macOS).
      把鸿蒙手机变成电脑的低延迟无线外设（触摸板 + 全键盘 + 语音听写）。
    contents:
      - src: daemon/packaging/udev/69-padlink-uinput.rules
        dst: /etc/udev/rules.d/69-padlink-uinput.rules
      - src: daemon/packaging/systemd/padlink.service
        dst: /usr/lib/systemd/user/padlink.service
    scripts:
      postinstall: daemon/packaging/scripts/postinstall.sh
      postremove: daemon/packaging/scripts/postremove.sh

checksum:
  name_template: "checksums.txt"

release:
  extra_files:
    # 一行安装脚本随版本入资产（不可变副本）；脚本只取包验签，安装逻辑单源在包内 install.sh / install.ps1
    - glob: script/install.sh
    - glob: script/install.ps1
  footer: |
    ---
    一行安装（Linux/macOS）：`curl -fsSL https://raw.githubusercontent.com/Norman-pong/padlink/main/script/install.sh | sh`
    一行安装（Windows，管理员 PowerShell）：`irm https://raw.githubusercontent.com/Norman-pong/padlink/main/script/install.ps1 | iex`

changelog:
  use: git
  sort: asc
